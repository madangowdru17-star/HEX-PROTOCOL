{% extends "base.html" %}
{% block title %}API Logs - HEX PROTOCOL{% endblock %}
{% block page_title %}API Request Logs{% endblock %}
{% block content %}

<div class="card">
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <button onclick="loadLogs('api')" class="btn btn-primary">API Requests</button>
        <button onclick="loadLogs('security')" class="btn" style="background: #f59e0b;">Security</button>
        <button onclick="loadLogs('audit')" class="btn" style="background: #8b5cf6;">Admin Actions</button>
    </div>
    
    <table>
        <thead>
            <tr><th>Time</th><th>Details</th><th>Status</th></tr>
        </thead>
        <tbody id="logsBody">
            <tr><td colspan="3" style="text-align: center;">Select a log type</td></tr>
        </tbody>
    </table>
</div>

{% endblock %}
{% block scripts %}
<script>
function loadLogs(type) {
    fetch(`/admin/api/logs?log_type=${type}`, { headers: {'Authorization': `Bearer ${localStorage.getItem('token')}`} })
    .then(r => r.json())
    .then(logs => {
        document.getElementById('logsBody').innerHTML = logs.map(l => `
            <tr>
                <td>${new Date(l.created_at).toLocaleString()}</td>
                <td>${l.license_key || l.event_type || l.action || l.endpoint || 'N/A'}</td>
                <td>${l.is_success !== undefined ? (l.is_success ? '<span style="color: #10b981;">Success</span>' : '<span style="color: #ef4444;">Failed</span>') : ''}</td>
            </tr>
        `).join('');
    });
}
</script>
{% endblock %}
