{% extends "base.html" %}
{% block title %}Logs - License Admin{% endblock %}
{% block page_title %}Logs{% endblock %}
{% block content %}
<div class="glass-card p-6">
    <div class="flex gap-4 mb-6">
        <button onclick="loadLogs('api')" class="px-4 py-2 rounded-lg bg-blue-600/20 text-blue-400 hover:bg-blue-600/30 transition-all">API Logs</button>
        <button onclick="loadLogs('security')" class="px-4 py-2 rounded-lg bg-yellow-600/20 text-yellow-400 hover:bg-yellow-600/30 transition-all">Security Events</button>
        <button onclick="loadLogs('audit')" class="px-4 py-2 rounded-lg bg-purple-600/20 text-purple-400 hover:bg-purple-600/30 transition-all">Admin Audit</button>
    </div>
    <div class="overflow-x-auto">
        <table class="w-full">
            <thead>
                <tr class="border-b border-gray-800">
                    <th class="text-left py-3 px-4">Time</th>
                    <th class="text-left py-3 px-4">Type</th>
                    <th class="text-left py-3 px-4">Details</th>
                    <th class="text-left py-3 px-4">Status</th>
                </tr>
            </thead>
            <tbody id="logsTableBody">
                <tr><td colspan="4" class="text-center py-4">Select a log type</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function loadLogs(type) {
    fetch(`/admin/api/logs?log_type=${type}`, {
        headers: {'Authorization': `Bearer ${localStorage.getItem('token')}`}
    })
    .then(res => res.json())
    .then(logs => {
        const tbody = document.getElementById('logsTableBody');
        if (logs.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center py-4">No logs found</td></tr>';
            return;
        }
        tbody.innerHTML = logs.map(log => `
            <tr class="border-b border-gray-800 hover:bg-gray-800/50">
                <td class="py-3 px-4">${new Date(log.created_at).toLocaleString()}</td>
                <td class="py-3 px-4">${log.event_type || log.action || log.endpoint || ''}</td>
                <td class="py-3 px-4">${log.description || log.details || log.error_message || log.license_key || ''}</td>
                <td class="py-3 px-4">
                    ${log.is_success !== undefined 
                        ? (log.is_success ? '<span class="text-green-400">Success</span>' : '<span class="text-red-400">Failed</span>')
                        : ''
                    }
                </td>
            </tr>
        `).join('');
    });
}
</script>
{% endblock %}
