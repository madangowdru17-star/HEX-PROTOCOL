{% extends "base.html" %}
{% block title %}Login - HEX PROTOCOL{% endblock %}
{% block content %}
<div style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="card" style="width: 100%; max-width: 400px; padding: 40px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <div style="width: 70px; height: 70px; margin: 0 auto 15px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 20px; display: flex; align-items: center; justify-content: center;">
                <i class="fas fa-shield-halved" style="font-size: 30px; color: white;"></i>
            </div>
            <h1 style="font-size: 24px; font-weight: bold;">HEX PROTOCOL</h1>
            <p style="color: #9ca3af; margin-top: 5px;">Admin Login</p>
        </div>
        
        <form id="loginForm">
            <div style="margin-bottom: 15px;">
                <label>Username</label>
                <input type="text" id="username" placeholder="admin" required>
            </div>
            <div style="margin-bottom: 20px;">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">
                <i class="fas fa-lock"></i> Sign In
            </button>
        </form>
        <div id="errorMsg" style="display: none; margin-top: 15px; padding: 10px; background: #ef444420; color: #ef4444; border-radius: 8px; text-align: center;"></div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData();
    formData.append('username', document.getElementById('username').value);
    formData.append('password', document.getElementById('password').value);
    
    const response = await fetch('/admin/api/auth/login', { method: 'POST', body: formData });
    if (response.ok) {
        const data = await response.json();
        localStorage.setItem('token', data.access_token);
        window.location.href = '/admin/dashboard';
    } else {
        document.getElementById('errorMsg').style.display = 'block';
        document.getElementById('errorMsg').textContent = 'Invalid credentials';
    }
});
</script>
{% endblock %}
