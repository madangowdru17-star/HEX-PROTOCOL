{% extends "base.html" %}
{% block title %}Login - HEX PROTOCOL{% endblock %}
{% block content %}
<div class="flex items-center justify-center min-h-screen py-12">
    <div class="w-full max-w-md">
        <div class="glass p-8" style="background: rgba(13, 13, 21, 0.8); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);">
            <div class="text-center mb-8">
                <div class="w-20 h-20 mx-auto mb-4 rounded-2xl bg-gradient-to-r from-blue-600 to-purple-600 flex items-center justify-center">
                    <i class="fas fa-shield-halved text-3xl text-white"></i>
                </div>
                <h1 class="text-3xl font-bold text-gradient">HEX PROTOCOL</h1>
                <p class="text-gray-400 mt-2">Advanced License Management System</p>
                <div class="mt-4 inline-flex items-center gap-2 bg-blue-500/10 text-blue-400 px-4 py-2 rounded-full text-xs">
                    <span class="w-2 h-2 bg-blue-400 rounded-full animate-pulse"></span>
                    Secure Access Required
                </div>
            </div>
            
            <form id="loginForm" class="space-y-5">
                <div>
                    <label><i class="fas fa-user mr-2"></i>Username</label>
                    <input type="text" id="username" name="username" required placeholder="Enter username">
                </div>
                <div>
                    <label><i class="fas fa-lock mr-2"></i>Password</label>
                    <input type="password" id="password" name="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn-gradient w-full py-3 rounded-xl font-semibold text-white">
                    <i class="fas fa-right-to-bracket mr-2"></i>Sign In
                </button>
            </form>
            
            <div id="errorMsg" class="mt-4 text-red-400 text-sm text-center bg-red-500/10 rounded-lg py-2 hidden"></div>
            
            <div class="mt-6 text-center text-xs text-gray-500">
                <p>Protected by HEX PROTOCOL Security</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.classList.add('hidden');
    
    const formData = new FormData();
    formData.append('username', document.getElementById('username').value);
    formData.append('password', document.getElementById('password').value);
    
    try {
        const response = await fetch('/admin/api/auth/login', {
            method: 'POST',
            body: formData
        });
        
        if (response.ok) {
            const data = await response.json();
            localStorage.setItem('token', data.access_token);
            window.location.href = '/admin/dashboard';
        } else {
            errorMsg.textContent = 'Invalid credentials. Access denied.';
            errorMsg.classList.remove('hidden');
        }
    } catch (error) {
        errorMsg.textContent = 'Connection error. Please try again.';
        errorMsg.classList.remove('hidden');
    }
});
</script>
{% endblock %}
