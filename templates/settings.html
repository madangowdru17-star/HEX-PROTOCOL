{% extends "base.html" %}
{% block title %}Settings - License Admin{% endblock %}
{% block page_title %}Settings{% endblock %}
{% block content %}
<div class="glass-card p-6 max-w-2xl">
    <h3 class="text-lg font-semibold mb-6">System Settings</h3>
    <div class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-2">Application Name</label>
            <input type="text" value="License Admin Panel" class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-700 focus:border-blue-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium mb-2">Rate Limit (requests/min)</label>
            <input type="number" value="60" class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-700 focus:border-blue-500 focus:outline-none">
        </div>
        <button class="px-6 py-3 rounded-lg bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 transition-all font-semibold">
            Save Settings
        </button>
    </div>
</div>
{% endblock %}
