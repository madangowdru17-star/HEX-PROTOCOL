{% extends "base.html" %}
{% block title %}Applications - License Admin{% endblock %}
{% block page_title %}Applications{% endblock %}
{% block content %}
<div class="glass-card p-6 mb-6">
    <h3 class="text-lg font-semibold mb-4">Create Application</h3>
    <form id="createAppForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
            <label class="block text-sm font-medium mb-2">Name</label>
            <input type="text" name="name" required class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-700 focus:border-blue-500 focus:outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium mb-2">Description</label>
            <input type="text" name="description" class="w-full px-4 py-3 rounded-lg bg-gray-800 border border-gray-700 focus:border-blue-500 focus:outline-none">
        </div>
        <div class="flex items-end">
            <button type="submit" class="w-full px-4 py-3 rounded-lg bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 transition-all font-semibold">
                Create App
            </button>
        </div>
    </form>
</div>

<div class="glass-card p-6">
    <h3 class="text-lg font-semibold mb-4">All Applications</h3>
    <div class="overflow-x-auto">
        <table class="w-full">
            <thead>
                <tr class="border-b border-gray-800">
                    <th class="text-left py-3 px-4">Name</th>
                    <th class="text-left py-3 px-4">Description</th>
                    <th class="text-left py-3 px-4">Status</th>
                    <th class="text-left py-3 px-4">Licenses</th>
                    <th class="text-left py-3 px-4">Actions</th>
                </tr>
            </thead>
            <tbody id="appsTableBody">
                <tr><td colspan="5" class="text-center py-4">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function loadApps() {
    fetch('/admin/api/apps', {
        headers: {'Authorization': `Bearer ${localStorage.getItem('token')}`}
    })
    .then(res => res.json())
    .then(apps => {
        const tbody = document.getElementById('appsTableBody');
        tbody.innerHTML = apps.map(app => `
            <tr class="border-b border-gray-800 hover:bg-gray-800/50">
                <td class="py-3 px-4">${app.name}</td>
                <td class="py-3 px-4">${app.description || '-'}</td>
                <td class="py-3 px-4">
                    <span class="px-2 py-1 rounded-full text-xs font-semibold ${app.is_active ? 'bg-green-600/20 text-green-400' : 'bg-red-600/20 text-red-400'}">
                        ${app.is_active ? 'Active' : 'Inactive'}
                    </span>
                </td>
                <td class="py-3 px-4">${app.license_count}</td>
                <td class="py-3 px-4">
                    <button onclick="toggleApp(${app.id})" class="text-blue-400 hover:text-blue-300">
                        ${app.is_active ? 'Deactivate' : 'Activate'}
                    </button>
                </td>
            </tr>
        `).join('');
    });
}

function toggleApp(id) {
    fetch(`/admin/api/apps/${id}/toggle`, {
        method: 'PUT',
        headers: {'Authorization': `Bearer ${localStorage.getItem('token')}`}
    })
    .then(() => loadApps());
}

document.getElementById('createAppForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    
    try {
        const response = await fetch('/admin/api/apps', {
            method: 'POST',
            headers: {'Authorization': `Bearer ${localStorage.getItem('token')}`},
            body: formData
        });
        const data = await response.json();
        if (data.api_key) {
            alert(`Application created!\nAPI Key: ${data.api_key}\n\nSave this key now!`);
            loadApps();
        }
    } catch (error) {
        alert('Error creating application');
    }
});

loadApps();
</script>
{% endblock %}
